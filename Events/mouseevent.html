<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        #BOX{
            height:300px;
            width:300px;
            background-color:lightblue;
            margin: 20px 0 0 100px;

        }
    </style>
</head>
<body>
    <script>
        function eventcall(){
            alert("These are the mouse events");
        }
        function events(){
            alert("These are the Second mouse events");
        }
        function mouse(){
            alert("These are the mouse over");
        }
        function mouseout(){
            alert("These are the mouse out");
        }
        function mousedown(){
            alert("These are the mouse down");
        }
        function mouseup(){
            alert("These are the mouse up");
        }
    </script>
    <div id="BOX" onclick="eventcall()">This is section A</div>
    <div id="BOX" ondblclick="events()">This is section B</div>
    <div id="BOX" onmouseover="mouse()">This is section C</div>
    <div id="BOX" onmouseout="mouseout()">This is section D</div>
    <div id="BOX" onmousedown="mousedown()">This is section E</div>
    <div id="BOX" onmouseup="mouseup()">This is section F</div>
</body>
</html>
