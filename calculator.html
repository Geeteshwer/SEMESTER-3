<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>
    <style>
        body{
            background-color: antiquewhite;
            border: 10px;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>

    <h2>Calculator</h2>

    <input type="number" id="num1" placeholder="First Number">
    <br><br>

    <input type="number" id="num2" placeholder="Second Number">
    <br><br>

    <button onclick="add()">Add</button>
    <button onclick="sub()">Subtract</button>
    <button onclick="product()">Product</button>
    <button onclick="Divide()">Divide</button>

    <h3 id="result"></h3>

    <script>
        function add() {
            let a = Number(document.getElementById("num1").value);
            let b = Number(document.getElementById("num2").value);

            let sum = a + b;

            document.getElementById("result").innerHTML = "Result = " + sum;
        }
        function sub() {
            let a = Number(document.getElementById("num1").value);
            let b = Number(document.getElementById("num2").value);

            let subtract = a - b;

            document.getElementById("result").innerHTML = "Result = " + subtract;
        }
        function Divide() {
            let a = Number(document.getElementById("num1").value);
            let b = Number(document.getElementById("num2").value);

            let divide = a / b;

            document.getElementById("result").innerHTML = "Result = " + divide;
        }
        function product() {
            let a = Number(document.getElementById("num1").value);
            let b = Number(document.getElementById("num2").value);

            let product = a * b;

            document.getElementById("result").innerHTML = "Result = " + product;
        }
    </script>

</body>
</html>
